# Render Blueprint for the AYDI backend.
#
# How to use:
#   1. Create an account at https://render.com
#   2. New → "Blueprint" → connect this Git repo → select branch `main`
#   3. Render reads this file, creates the service automatically.
#   4. Set the env vars marked `sync: false` in the dashboard once
#      (Render won't put secret values in the YAML for you).
#
# Why Docker not native: AYDI ships Alembic migrations + a custom
# entrypoint, so we want full control over the start sequence.
services:
  - type: web
    name: aydi-backend
    plan: free                       # 750h/month, sleeps after 15min idle
    region: frankfurt                # closest to most EU yacht designers
    runtime: docker
    dockerfilePath: ./docker/Dockerfile.backend
    dockerContext: .                 # repo root (Dockerfile needs both backend/ and docker/)
    healthCheckPath: /health/ready
    autoDeploy: true
    envVars:
      # Database — paste your Neon connection string here, e.g.
      #   postgresql+asyncpg://USER:PASS@ep-xxx.eu-central-1.aws.neon.tech/aydi
      - key: DATABASE_URL
        sync: false                  # set in dashboard, NOT in git
      # CORS — die TATSAECHLICHEN Vercel-Domains des Projekts. Hier standen
      # aydi.vercel.app und aydi.pages.dev; beide existieren nicht.
      #
      # Auf dem normalen Weg greift CORS gar nicht: vercel.json
      # schreibt /api/* serverseitig auf diesen Dienst um, der Browser sieht
      # also nur die Vercel-Domain und stellt keine fremde Anfrage. Die Liste
      # zaehlt trotzdem — fuer jeden direkten Zugriff auf das Backend, und
      # falls der Rewrite je entfaellt. Muss ein JSON-Array als Zeichenkette
      # sein; ein '*' lehnt die Eingabepruefung ab, weil die API Anmeldedaten
      # sendet.
      - key: CORS_ORIGINS
        value: '["https://aydi-omega.vercel.app","https://aydi-js-projects-987ec0f8.vercel.app","https://aydi-git-main-js-projects-987ec0f8.vercel.app"]'
      # Anthropic API key for the visual analysis pipeline
      - key: ANTHROPIC_API_KEY
        sync: false
      # JWT secret — generate one with: python -c "import secrets; print(secrets.token_urlsafe(64))"
      - key: SECRET_KEY
        sync: false
      # Production hardening
      #
      # ENVIRONMENT=production ist der Schalter, der den Boot-Guard in
      # backend/app/core/config.py (_enforce_production_security) scharf macht:
      # Ohne ihn startet die App auch dann, wenn SECRET_KEY oben im Dashboard
      # vergessen wurde — dann mit dem im Repo öffentlich lesbaren Default-Key,
      # mit dem sich beliebige JWTs inklusive Admin-Rolle fälschen lassen.
      # Bewusst "fail closed": lieber ein fehlgeschlagenes Deployment als ein
      # laufendes mit fälschbaren Tokens.
      - key: ENVIRONMENT
        value: "production"
      - key: AUTH_COOKIE_ONLY
        value: "true"
      - key: COOKIE_SECURE
        value: "true"
      - key: LOG_JSON
        value: "true"
      - key: LOG_LEVEL
        value: "INFO"
      # Hinter Render kommt JEDE Anfrage vom selben Proxy. Ohne diesen Schalter
      # nimmt app.core.middleware.client_ip die Adresse der Verbindung — also
      # immer die des Proxys — und alle Besucher teilen sich einen Zaehler:
      #   * Ratenbegrenzung: 10 Bild-Uploads/min, 30 Schnellanalysen/min und
      #     60 Wissensabrufe/min gelten dann fuer die GESAMTE Seite zusammen.
      #   * Anmeldesperre: fuenf Fehlversuche irgendeines Besuchers sperren
      #     15 Minuten lang alle uebrigen aus.
      # Nur einschalten, weil hier tatsaechlich ein vertrauenswuerdiger Proxy
      # davorsteht — direkt aus dem Netz erreichbar waere die Kopfzeile
      # faelschbar und die Sperre damit wirkungslos.
      - key: TRUST_PROXY_HEADERS
        value: "true"
      # Render injects $PORT automatically; our entrypoint respects it.
