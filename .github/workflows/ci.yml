name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    name: Backend (pytest + lint + alembic)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: aydi_test
          POSTGRES_USER: aydi
          POSTGRES_PASSWORD: aydi
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U aydi"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql+asyncpg://aydi:aydi@localhost:5432/aydi_test
      PYTHONPATH: backend
      LOG_LEVEL: WARNING
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install backend deps
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt
          pip install ruff mypy

      - name: Ruff lint
        run: ruff check backend/app

      - name: Alembic upgrade (schema dry-run)
        working-directory: backend
        run: alembic upgrade head

      - name: Alembic downgrade base then upgrade head (round-trip)
        working-directory: backend
        run: |
          alembic downgrade base
          alembic upgrade head

      - name: pytest
        working-directory: backend
        run: pytest tests/ -v --tb=short

  frontend:
    name: Frontend (tsc + build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install
        run: npm ci

      - name: Typecheck
        run: npx tsc --noEmit

      - name: Build
        run: npm run build
