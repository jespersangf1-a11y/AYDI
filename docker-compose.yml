services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-aydi}
      POSTGRES_USER: ${POSTGRES_USER:-aydi}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-aydi}
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U aydi"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: .
      dockerfile: docker/Dockerfile.backend
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgresql+asyncpg://aydi:aydi@db:5432/aydi}
      CORS_ORIGINS: ${CORS_ORIGINS:-["http://localhost:5173","http://localhost"]}
    ports:
      - "8000:8000"
    # Dev mode: skip the production entrypoint (alembic + uvicorn) and run
    # uvicorn with --reload. Production deployments use the entrypoint
    # defined in Dockerfile.backend (which runs `alembic upgrade head`
    # before starting). For local dev, run `alembic upgrade head` manually
    # inside the container once after starting: `docker compose exec backend alembic upgrade head`.
    entrypoint: []
    command: sh -c "alembic upgrade head && uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload"
    volumes:
      - ./backend:/app/backend

  frontend:
    build:
      context: .
      dockerfile: docker/Dockerfile.frontend
    depends_on:
      - backend
    ports:
      - "80:80"

volumes:
  pgdata:
